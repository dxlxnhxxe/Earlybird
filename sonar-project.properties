sonar.projectKey=earlybird
sonar.projectName=EarlyBird MonoRepo
sonar.projectVersion=1.0

# Sources to analyze (comma-separated relative paths)
sonar.sources=earlybird-back/src,earlybird-dashboard/src,earlybird-front/src

# Exclude vendored and build artefacts
sonar.exclusions=**/vendor/**,**/node_modules/**,**/dist/**,**/build/**,**/*.min.js

# Coverage reports (adjust paths if you generate them elsewhere)
sonar.javascript.lcov.reportPaths=earlybird-front/coverage/lcov.info,earlybird-dashboard/coverage/lcov.info
sonar.php.coverage.reportPaths=earlybird-back/coverage/coverage.xml

sonar.sourceEncoding=UTF-8
