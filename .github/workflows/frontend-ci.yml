name: Frontend CI

on:
  push:
    branches: [ "main", "develop", "EB-*" ]
    paths:
      - 'earlybird-front/**'
      - 'earlybird-dashboard/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'earlybird-front/**'
      - 'earlybird-dashboard/**'

jobs:
  test-front:
    name: Test EarlyBird Front
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./earlybird-front
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: earlybird-front/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint
        continue-on-error: true
      
      - name: Check formatting
        run: npm run format
        continue-on-error: true
      
      - name: Run tests
        run: npm run test
        continue-on-error: true
      
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000

  test-dashboard:
    name: Test EarlyBird Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./earlybird-dashboard
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: earlybird-dashboard/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint
        continue-on-error: true
      
      - name: Check formatting
        run: npm run format:check
        continue-on-error: true
      
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000
