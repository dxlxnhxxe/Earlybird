# config/services.yaml

parameters:

services:
    # Default configuration for all services
    _defaults:
        autowire: true      # Automatically inject dependencies in your services
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # ✅ Automatically load all classes in src/ (except excluded folders)
    App\:
        resource: '../src/*'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # ✅ Make controllers available as services
    App\Controller\:
        resource: '../src/Controller'
        tags: ['controller.service_arguments']

    # ✅ Explicitly register repositories for Doctrine
    App\Repository\:
        resource: '../src/Repository'
        tags: ['doctrine.repository_service']
