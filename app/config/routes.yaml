controllers:
    resource: ../src/Controller/
    type: attribute

homepage:
    path: /
    controller: App\Controller\HomeController::index

user_create:
    path: /users
    controller: App\Controller\HomeController::createUser
    methods: [POST]

user_delete:
    path: /users
    controller: App\Controller\HomeController::deleteUser
    methods: [DELETE]

user_display:
    path: /users
    controller: App\Controller\HomeController::displayUser
    methods: [GET]

team_create:
    path: /teams
    controller: App\Controller\TeamsController::createTeam
    methods: [POST]

team_list:
    path: /teams
    controller: App\Controller\TeamsController::listTeams
    methods: [GET]
